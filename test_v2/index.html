<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資料管理網頁</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="notification-container"></div>
    <h1>資料管理</h1>

    <div id="add-form-container">
        <h2>新增紀錄</h2>
        <form id="add-record-form">
            <input type="text" id="record-no" placeholder="編號" required>
            <input type="text" id="record-name" placeholder="姓名" required>
            <input type="text" id="record-unit" placeholder="單位" required>
            <button type="submit">新增</button>
        </form>
    </div>

    <div id="search-container">
        <h2>查詢紀錄</h2>
        <input type="text" id="search-input" placeholder="輸入關鍵字查詢...">
    </div>

    <div id="table-container">
        <h2>資料列表</h2>
        <!-- Data table will go here -->
    </div>

    <script src="js/app.js"></script>
</body>
</html>
